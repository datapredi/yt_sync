<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube 逐字稿產生器</title>
<style>
  :root{
    --bg:#f5f3ef; --card:#ffffff; --text:#1f1b16; --muted:#7a7368;
    --accent:#c1440e; --border:#e2ddd3; --ok:#3a7d44; --err:#b3261e;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#181512; --card:#242019; --text:#f2ede4; --muted:#a89e8f;
      --accent:#e07b45; --border:#3a342b; --ok:#7bc47f; --err:#e57373;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,"Segoe UI",Helvetica,Arial,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  .wrap{max-width:560px; margin:0 auto; padding:24px 16px 60px;}
  h1{font-size:1.25rem; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:0.85rem; margin-bottom:20px; line-height:1.5;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:16px;}
  label{display:block; font-size:0.85rem; color:var(--muted); margin-bottom:6px;}
  textarea{
    width:100%; font-family:inherit; font-size:0.9rem; padding:12px 14px; border-radius:10px;
    border:1px solid var(--border); background:var(--bg); color:var(--text); margin-bottom:14px;
    resize:vertical; min-height:5.5em;
  }
  select{
    font-family:inherit; font-size:0.9rem; padding:10px 12px; border-radius:10px;
    border:1px solid var(--border); background:var(--bg); color:var(--text); margin-bottom:14px;
  }
  button{
    font-family:inherit; font-size:0.95rem; padding:12px 20px; border-radius:10px;
    border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; font-weight:600;
  }
  button:disabled{opacity:0.5; cursor:default;}
  .hint{font-size:0.8rem; color:var(--muted); margin-top:10px; line-height:1.6;}
  audio{width:100%; margin-top:10px;}

  .queue-item{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px 20px; margin-bottom:12px;
  }
  .queue-item .qurl{font-size:0.85rem; word-break:break-all; color:var(--muted); margin-bottom:8px;}
  .queue-item .qstatusrow{display:flex; align-items:center; gap:8px; font-size:0.9rem;}
  .queue-item .qbadge{
    font-size:0.72rem; padding:2px 9px; border-radius:999px; flex:0 0 auto; font-weight:600;
  }
  .qbadge.waiting{background:var(--bg); color:var(--muted); border:1px solid var(--border);}
  .qbadge.working{background:var(--accent); color:#fff;}
  .qbadge.ok{background:var(--ok); color:#fff;}
  .qbadge.err{background:var(--err); color:#fff;}
  .spinner{
    width:14px; height:14px; border-radius:50%; border:2px solid var(--border); border-top-color:var(--accent);
    animation:spin 0.8s linear infinite; flex:0 0 auto;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .queue-item .qresult{margin-top:10px; font-size:0.85rem; line-height:1.8;}
  .queue-item .qresult code{background:var(--bg); padding:2px 6px; border-radius:6px; font-size:0.85em;}
  .queue-item .qerr{margin-top:8px; font-size:0.85rem; color:var(--err); white-space:pre-wrap; word-break:break-word;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 YouTube 逐字稿產生器</h1>
  <div class="sub">貼 YouTube 網址（一行一個，可以貼很多個），自動下載音檔＋用 Whisper 轉出逐字稿，存到 <code>output/</code> 資料夾，之後可以在 <code>player.html</code> 挑這兩個檔案播放。多個網址會依序處理（不是同時），避免互搶 CPU 反而更慢。</div>
  <div class="sub">如果失敗訊息裡有 <code>HTTP Error 403</code>：YouTube 擋了沒有登入的下載請求。用瀏覽器分機（例如 Chrome 的「Get cookies.txt LOCALLY」）登入 YouTube 後匯出 cookies，存成 <code>cookies.txt</code> 放到 <code>yt_sync</code> 資料夾裡，就會自動套用，不用改任何設定。</div>

  <div class="card">
    <label for="urlInput">YouTube 網址（一行一個）</label>
    <textarea id="urlInput" rows="4" placeholder="https://www.youtube.com/watch?v=...&#10;https://www.youtube.com/watch?v=..."></textarea>
    <label for="modelSelect">Whisper 模型（越大越準，但越慢）</label>
    <select id="modelSelect">
      <option value="tiny">tiny（最快，準確度較低）</option>
      <option value="small" selected>small（預設，速度/準確度平衡）</option>
      <option value="medium">medium（較準，較慢）</option>
    </select>
    <div>
      <button id="btnGenerate">開始產生</button>
    </div>
  </div>

  <div id="queueList"></div>
</div>

<script>
  const urlInput = document.getElementById('urlInput');
  const modelSelect = document.getElementById('modelSelect');
  const btnGenerate = document.getElementById('btnGenerate');
  const queueListEl = document.getElementById('queueList');

  function formatDuration(s){
    const m = Math.floor(s / 60);
    const sec = Math.round(s % 60);
    return `${m}:${sec.toString().padStart(2, '0')}`;
  }

  function parseUrls(raw){
    return raw.split('\n').map((s) => s.trim()).filter((s) => s.length > 0);
  }

  function makeQueueItem(url){
    const el = document.createElement('div');
    el.className = 'queue-item';
    el.innerHTML = `
      <div class="qurl">${url}</div>
      <div class="qstatusrow">
        <span class="qbadge waiting">等待中</span>
        <div class="spinner" style="display:none;"></div>
        <span class="qmsg"></span>
      </div>
      <div class="qresult hidden"></div>
      <div class="qerr hidden"></div>
    `;
    return {
      el,
      badge: el.querySelector('.qbadge'),
      spinner: el.querySelector('.spinner'),
      msg: el.querySelector('.qmsg'),
      resultBox: el.querySelector('.qresult'),
      errBox: el.querySelector('.qerr'),
    };
  }

  function setQueueItemState(item, state, text){
    item.badge.className = 'qbadge ' + state;
    item.badge.textContent = { waiting: '等待中', working: '處理中', ok: '完成', err: '失敗' }[state];
    item.spinner.style.display = state === 'working' ? 'block' : 'none';
    item.msg.textContent = text || '';
  }

  async function pollStatus(jobId, item){
    let res;
    try {
      res = await fetch(`/api/status?job_id=${jobId}`);
    } catch (err) {
      setQueueItemState(item, 'err', '');
      item.errBox.classList.remove('hidden');
      item.errBox.textContent = '連不到本地伺服器，請確認 server.py 還在執行中：' + err.message;
      return;
    }
    if (!res.ok) {
      setQueueItemState(item, 'err', '');
      item.errBox.classList.remove('hidden');
      item.errBox.textContent = '查詢進度失敗（HTTP ' + res.status + '）';
      return;
    }
    const job = await res.json();
    if (job.stage === 'error') {
      setQueueItemState(item, 'err', '');
      item.errBox.classList.remove('hidden');
      item.errBox.textContent = '失敗：' + job.message;
      return;
    }
    if (job.done) {
      setQueueItemState(item, 'ok', '');
      const r = job.result;
      item.resultBox.classList.remove('hidden');
      item.resultBox.innerHTML = `
        標題：${r.title}<br>
        音檔：<code>${r.audio_file}</code><br>
        逐字稿：<code>${r.json_file}</code><br>
        長度：${formatDuration(r.duration)}，共 ${r.sentences} 句<br>
        時間軸來源：${r.used_captions ? '官方字幕校正過（較準）' : '純 Whisper（這支影片沒有官方字幕）'}<br>
        處理時間：${formatDuration(r.elapsed_seconds)}<br>
        <audio controls src="/output/${encodeURIComponent(r.audio_file)}"></audio>
      `;
      return;
    }
    setQueueItemState(item, 'working', job.message || '處理中...');
    await new Promise((resolve) => setTimeout(resolve, 1500));
    await pollStatus(jobId, item);
  }

  async function runOne(url, model, item){
    setQueueItemState(item, 'working', '送出中...');
    let res;
    try {
      res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, model })
      });
    } catch (err) {
      setQueueItemState(item, 'err', '');
      item.errBox.classList.remove('hidden');
      item.errBox.textContent = '連不到本地伺服器，請先執行 python server.py：' + err.message;
      return;
    }
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      setQueueItemState(item, 'err', '');
      item.errBox.classList.remove('hidden');
      item.errBox.textContent = '啟動失敗：' + (body.error || res.status);
      return;
    }
    const data = await res.json();
    await pollStatus(data.job_id, item);
  }

  // A single persistent queue that one background loop drains -- clicking
  // "開始產生" again while it's already processing just appends more work
  // instead of being blocked until the current batch finishes. Model is
  // captured per-item at submit time (not read fresh when each item
  // starts), so changing the dropdown only affects URLs submitted after
  // that change, not ones already queued.
  const queue = [];
  let processing = false;

  async function drainQueue(){
    if (processing) return; // a loop is already running and will pick up what we just pushed
    processing = true;
    let done = 0;
    const total = () => done + queue.length;
    while (queue.length > 0) {
      const { url, model, item } = queue.shift();
      btnGenerate.textContent = `處理中... (${done + 1}/${total()})`;
      await runOne(url, model, item);
      done++;
    }
    processing = false;
    btnGenerate.textContent = '開始產生';
  }

  btnGenerate.addEventListener('click', () => {
    const urls = parseUrls(urlInput.value);
    if (urls.length === 0) { alert('請先貼至少一個 YouTube 網址'); return; }
    const model = modelSelect.value;

    // Build the new batch as one fragment so it inserts as a group above
    // any earlier batches, preserving the URLs' own top-to-bottom order
    // within the batch (inserting one at a time at the top would reverse
    // them instead).
    const fragment = document.createDocumentFragment();
    urls.forEach((url) => {
      const item = makeQueueItem(url);
      fragment.appendChild(item.el);
      queue.push({ url, model, item });
    });
    queueListEl.insertBefore(fragment, queueListEl.firstChild);
    urlInput.value = '';

    drainQueue();
  });
</script>
</body>
</html>
